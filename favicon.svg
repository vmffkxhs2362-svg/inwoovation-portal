<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Multi-span Venlo glasshouse roof profile -->
  <polyline points="8,36 20,18 32,36 44,18 56,36" fill="none" stroke="url(#accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Structural columns & ground gutter -->
  <line x1="12" y1="36" x2="12" y2="50" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="50" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="52" y1="36" x2="52" y2="50" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="8" y1="50" x2="56" y2="50" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Precision node dot -->
  <circle cx="32" cy="14" r="3.5" fill="#34d399"/>
</svg>
