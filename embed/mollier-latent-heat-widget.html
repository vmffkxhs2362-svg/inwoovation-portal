<body>
  <div class="widget-card">
    <div class="widget-header">
      <a href="https://inwoovation.com" target="_blank" rel="noopener" class="widget-brand">
        <span>INWOOVATION</span> LAB

    </div>

    <div class="kpi-grid">
      <div class="kpi-cell">
        <div class="kpi-lbl" id="lbl-k1">Latent Reheat</div>
        <div class="kpi-val" id="val-qrec">214 kW</div>
      </div>
      <div class="kpi-cell">
        <div class="kpi-lbl" id="lbl-k2">Condensate</div>
        <div class="kpi-val" id="val-cond" style="color:#38bdf8;">245 L/h</div>
      </div>
      <div class="kpi-cell">
        <div class="kpi-lbl" id="lbl-k3">Thermal COP</div>
        <div class="kpi-val" id="val-cop" style="color:#fbbf24;">4.60</div>
      </div>
    </div>

    <canvas id="hx-canvas" width="326" height="112" aria-label="Mollier h-x Psychrometric State Vector"></canvas>

    <div class="slider-group">
      <div class="slider-label">
        <span id="s-lbl-t">Canopy Air Temp</span>
        <span id="val-t" class="slider-val">24.0 °C</span>
      </div>
      <input type="range" id="sl-t" min="14" max="36" step="0.5" value="24.0">
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span id="s-lbl-rh">Canopy Relative Humidity</span>
        <span id="val-rh" class="slider-val">84 %</span>
      </div>
      <input type="range" id="sl-rh" min="45" max="98" step="1" value="84">
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span id="s-lbl-coil">ATU Coil Dew-Point</span>
        <span id="val-coil" class="slider-val">11.5 °C</span>
      </div>
      <input type="range" id="sl-coil" min="5" max="22" step="0.5" value="11.5">
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span id="s-lbl-flow">ATU Circulation Flow</span>
        <span id="val-flow" class="slider-val">45,000 m³/h</span>
      </div>
      <input type="range" id="sl-flow" min="10000" max="120000" step="5000" value="45000">
    </div>

    <div class="widget-footer">
      <a id="w-link" href="https://inwoovation.com/tools/semi-closed-greenhouse-atu-mollier-simulator.html" target="_blank" rel="noopener">Open Full 3D Semi-Closed ATU Solver →</a>
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search || '');
      const isDe = (params.get('lang') || '').toLowerCase() === 'de';
      if (isDe) {
        document.documentElement.lang = 'de';
        document.getElementById('w-badge').textContent = 'MOLLIER h,x KLIMAZELLE';
        document.getElementById('lbl-k1').textContent = 'Heizleistung';
        document.getElementById('lbl-k2').textContent = 'Kondensat';
        document.getElementById('lbl-k3').textContent = 'COP (therm.)';
        document.getElementById('s-lbl-t').textContent = 'Bestandsluft-Temperatur';
        document.getElementById('s-lbl-rh').textContent = 'Relative Luftfeuchte (rF)';
        document.getElementById('s-lbl-coil').textContent = 'Register-Taupunkt';
        document.getElementById('s-lbl-flow').textContent = 'Umluftvolumenstrom';
        document.getElementById('w-link').textContent = 'Vollständigen ATU-Mollier-Rechner öffnen →';
      }

      const slT = document.getElementById('sl-t');
      const slRh = document.getElementById('sl-rh');
      const slCoil = document.getElementById('sl-coil');
      const slFlow = document.getElementById('sl-flow');
      const canvas = document.getElementById('hx-canvas');
      const ctx = canvas.getContext('2d');

      function satX(tempC) {
        const es = 0.61078 * Math.exp((17.27 * tempC) / (tempC + 237.3));
        return 621.98 * es / Math.max(1.0, 101.325 - es);
      }

      function drawMollier(x1, t1, x2, t2, hIn, hOut) {
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Coordinate map: x in [0, 28 g/kg] -> px [28, W-14]; T in [2, 38 °C] -> py [H-18, 12]
        const mapX = (x) => 28 + (Math.min(28, Math.max(0, x)) / 28) * (W - 42);
        const mapY = (t) => (H - 18) - ((Math.min(38, Math.max(2, t)) - 2) / 36) * (H - 30);

        // Subtle grid
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
        ctx.lineWidth = 1;
        for (let xg = 5; xg <= 25; xg += 5) {
          const px = mapX(xg);
          ctx.beginPath(); ctx.moveTo(px, 10); ctx.lineTo(px, H - 16); ctx.stroke();
        }
        for (let tg = 10; tg <= 30; tg += 10) {
          const py = mapY(tg);
          ctx.beginPath(); ctx.moveTo(28, py); ctx.lineTo(W - 14, py); ctx.stroke();
        }

        // 100% RH saturation curve
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (let tc = 2; tc <= 36; tc += 1) {
          const xs = satX(tc);
          if (xs > 28.5) break;
          const px = mapX(xs), py = mapY(tc);
          if (tc === 2) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // State vector: 1 (Canopy) -> 2 (Coil Dew-Point) -> 3 (Condenser Reheat at constant x2)
        const p1x = mapX(x1), p1y = mapY(t1);
        const p2x = mapX(x2), p2y = mapY(t2);
        const p3x = p2x, p3y = mapY(Math.min(36, t1 + 1.5));

        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(p1x, p1y);
        ctx.lineTo(p2x, p2y);
        ctx.stroke();

        ctx.strokeStyle = '#f59e0b';
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(p2x, p2y);
        ctx.lineTo(p3x, p3y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Plot state nodes
        [[p1x, p1y, '#38bdf8', '1'], [p2x, p2y, '#10b981', '2'], [p3x, p3y, '#f59e0b', '3']].forEach(([px, py, col, lbl]) => {
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#e2e8f0';
          ctx.font = 'bold 9px JetBrains Mono, monospace';
          ctx.fillText(lbl, px + 5, py - 4);
        });

        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px Plus Jakarta Sans, sans-serif';
        ctx.fillText('x [g/kg]', W - 46, H - 5);
        ctx.fillText(`Δh = ${(hIn - hOut).toFixed(1)} kJ/kg`, 32, 16);
      }

      function update() {
        const t = parseFloat(slT.value) || 24.0;
        const rh = parseFloat(slRh.value) || 84.0;
        const coil = parseFloat(slCoil.value) || 11.5;
        const flow = parseFloat(slFlow.value) || 45000.0;

        document.getElementById('val-t').textContent = t.toFixed(1) + ' °C';
        document.getElementById('val-rh').textContent = rh.toFixed(0) + ' %';
        document.getElementById('val-coil').textContent = coil.toFixed(1) + ' °C';
        document.getElementById('val-flow').textContent = Math.round(flow).toLocaleString() + ' m³/h';

        const res = window.BiophysicsKernel.computeMollierLatentRecovery({
          tCanopyC: t,
          rhCanopyPct: rh,
          tEvapCoilC: coil,
          airflowM3h: flow,
          copCompressor: 4.6
        });

        document.getElementById('val-qrec').textContent = Math.round(res.condenserReheatKw) + ' kW';
        document.getElementById('val-cond').textContent = res.condensateLitersPerHour.toFixed(1) + ' L/h';
        document.getElementById('val-cop').textContent = res.effectiveCopThermal.toFixed(2);

        drawMollier(
          res.humidityRatioInGKg,
          t,
          res.humidityRatioOutGKg,
          Math.min(t, coil),
          res.enthalpyInKjKg,
          res.enthalpyOutKjKg
        );
      }

      [slT, slRh, slCoil, slFlow].forEach(el => el.addEventListener('input', update));
      update();
    })();
  </script>
</body>
