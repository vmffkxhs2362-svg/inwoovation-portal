<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Light Integral (DLI) Widget | Inwoovation Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .widget-card {
      width: 100%;
      max-width: 340px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .widget-brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      color: #facc15;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .widget-brand span { color: #f8fafc; }
    .dli-display-box {
      text-align: center;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .dli-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: #facc15;
      line-height: 1;
    }
    .dli-unit { font-size: 0.9rem; color: #94a3b8; margin-left: 4px; }
    .dli-status {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 100px;
      display: inline-block;
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
    }
    .slider-group { margin-bottom: 10px; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .slider-val { color: #facc15; font-family: 'JetBrains Mono', monospace; }
    input[type=range] {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #facc15;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.6);
    }
    .widget-footer {
      text-align: center;
      margin-top: 10px;
      font-size: 0.7rem;
      color: #64748b;
    }
    .widget-footer a { color: #facc15; text-decoration: none; font-weight: 600; }
    .widget-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="widget-header">
      <a href="https://inwoovation.com" target="_blank" class="widget-brand">
        <span>INWOOVATION</span> LAB
      </a>
      <span style="font-size: 0.7rem; color: #facc15; font-weight: 700;">LIVE DLI WIDGET</span>
    </div>

    <div class="dli-display-box">
      <div>
        <span id="dli-num" class="dli-value">25.9</span>
        <span class="dli-unit">mol/m²/day</span>
      </div>
      <div id="dli-status" class="dli-status">Optimal Vine Fruiting</div>
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span>Canopy PPFD (PAR)</span>
        <span id="ppfd-val" class="slider-val">450 µmol/m²/s</span>
      </div>
      <input type="range" id="ppfd-slider" min="50" max="1500" step="25" value="450">
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span>Photoperiod Duration</span>
        <span id="hours-val" class="slider-val">16.0 Hours</span>
      </div>
      <input type="range" id="hours-slider" min="4" max="24" step="0.5" value="16.0">
    </div>

    <div class="widget-footer">
      Powered by <a href="https://inwoovation.com" target="_blank">Inwoovation Lab OpenCEA</a>
    </div>
  </div>

  <script>
    function update() {
      const ppfd = parseFloat(document.getElementById('ppfd-slider').value);
      const hours = parseFloat(document.getElementById('hours-slider').value);

      document.getElementById('ppfd-val').innerText = ppfd + ' µmol/m²/s';
      document.getElementById('hours-val').innerText = hours.toFixed(1) + ' Hours';

      // DLI = PPFD * Hours * 3600 / 1,000,000
      const dli = (ppfd * hours * 3600) / 1000000.0;
      const dliEl = document.getElementById('dli-num');
      const statusEl = document.getElementById('dli-status');

      dliEl.innerText = dli.toFixed(1);

      if (dli < 12) {
        statusEl.innerText = 'Microgreens & Propagation';
        statusEl.style.color = '#38bdf8';
      } else if (dli <= 18) {
        statusEl.innerText = 'Lettuce & Leafy Greens Target';
        statusEl.style.color = '#10b981';
      } else if (dli <= 30) {
        statusEl.innerText = 'Commercial Tomato & Pepper Target';
        statusEl.style.color = '#facc15';
      } else {
        statusEl.innerText = 'High-DLI CEA Cannabis / Strawberry';
        statusEl.style.color = '#a855f7';
      }
    }

    document.querySelectorAll('input').forEach(el => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
